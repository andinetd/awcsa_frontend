name: Deploy Frontend

on:
  push:
    branches: [ dev, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            cd ~/Desktop/awcsa-frontend

            git reset --hard
            git pull origin ${{ github.ref_name }}

            npm install

            npm run build

            pm2 restart awcsa-frontend || pm2 start npm --name awcsa-frontend -- start

            pm2 save